# Flatpak manifest for Marker.
#
# Build and install for the current user (needs flatpak-builder and the
# Flathub remote):
#
#   flatpak-builder --user --install --force-clean \
#       --install-deps-from=flathub build-dir flatpak/io.github.dan_kun.Marker.yml
#   flatpak run io.github.dan_kun.Marker
#
# The GNOME runtime provides Python, PyGObject, GTK 4, libadwaita,
# GtkSourceView 5 and WebKitGTK 6.0, so no host packages are needed.
app-id: io.github.dan_kun.Marker
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: marker

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # The file explorer and "Find in Folder" read whole folders, which the
  # file-chooser portal cannot grant.
  - --filesystem=home
  # Remote images in documents
  - --share=network

modules:
  - name: marker
    buildsystem: simple
    build-commands:
      # Builds have no network access: setuptools comes from the SDK
      - pip3 install --prefix=/app --no-deps --no-build-isolation .
      - install -Dm644 data/io.github.dan_kun.Marker.svg
        /app/share/icons/hicolor/scalable/apps/io.github.dan_kun.Marker.svg
      - sed -e 's|@LAUNCHER@|marker|' -e '/^# @LAUNCHER@/d' data/io.github.dan_kun.Marker.desktop
        > io.github.dan_kun.Marker.desktop
      - install -Dm644 io.github.dan_kun.Marker.desktop -t /app/share/applications
      - install -Dm644 data/io.github.dan_kun.Marker.metainfo.xml -t /app/share/metainfo
    sources:
      - type: dir
        path: ..
        skip:
          - build-dir
          - .flatpak-builder
          - .venv
          # use the pinned downloads below, not whatever is in the checkout
          - marker/data/web/js
          - marker/data/web/css-vendor
      # The preview's JavaScript/CSS libraries, generated by
      # scripts/flatpak-sources.py from scripts/vendor-files.txt
      - vendor-sources.json
