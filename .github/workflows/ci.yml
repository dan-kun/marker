name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Ruff
        run: pipx run ruff==0.15.8 check .

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install GTK stack
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-gi-cairo gir1.2-gtk-4.0 gir1.2-adw-1 \
            gir1.2-gtksource-5 gir1.2-webkit-6.0 python3-pytest xvfb

      - name: Fetch preview dependencies
        run: bash scripts/fetch-deps.sh

      - name: Tests
        env:
          GTK_A11Y: none
          # Ubuntu 24.04 restricts the unprivileged user namespaces that
          # WebKit's bubblewrap sandbox needs; the tests only load local pages.
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: "1"
        run: xvfb-run -a /usr/bin/python3 -m pytest -v
