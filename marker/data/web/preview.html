<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Rendered documents are untrusted: no network requests from scripts,
       no plugins, and only local scripts/styles. Images may be remote. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src file: 'unsafe-inline'; style-src file: 'unsafe-inline'; font-src file: data:; img-src file: data: http: https:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Preview</title>

  <!-- KaTeX -->
  <link rel="stylesheet" href="css-vendor/katex.min.css">
  <!-- Highlight.js theme (swapped by setTheme) -->
  <link id="hljs-theme" rel="stylesheet" href="css-vendor/highlight-light.min.css">
  <!-- GitHub Markdown base style -->
  <link rel="stylesheet" href="css-vendor/github-markdown.css">
  <!-- Our custom overrides -->
  <link id="marker-theme" rel="stylesheet" href="css/preview-light.css">

  <style>
    /* Base reset */
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.6;
    }
    .markdown-body .task-list-item { list-style-type: none; }
    .markdown-body .task-list-item input { margin: 0 0.35em 0.2em -1.4em; vertical-align: middle; }
    .markdown-body {
      max-width: 800px;
      margin: 0 auto;
      padding: 32px 24px;
    }
    /* Mermaid diagrams */
    .mermaid {
      text-align: center;
      margin: 1em 0;
    }
    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { border-radius: 4px; }
    /* Empty state */
    #empty-state {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #888;
      font-size: 1.1em;
      font-style: italic;
    }
  </style>
</head>
<body class="light">
  <div id="empty-state">Start typing to see the preview…</div>
  <article id="content" class="markdown-body" style="display:none"></article>

  <!-- Vendor scripts (loaded after DOM) -->
  <script src="js/purify.min.js"></script>
  <script src="js/markdown-it.min.js"></script>
  <script src="js/markdown-it-footnote.min.js"></script>
  <script src="js/katex.min.js"></script>
  <script src="js/auto-render.min.js"></script>
  <script src="js/highlight.min.js"></script>
  <!-- mermaid.min.js (2.7 MB) is loaded on demand: see loadMermaid() -->

  <script>
    // ── Markdown-it setup ─────────────────────────────────────────────────
    // Raw HTML in documents is only enabled when DOMPurify is available to
    // strip scripts, event handlers and other active content from it.
    const sanitize = window.DOMPurify
      ? (html) => DOMPurify.sanitize(html, { ADD_ATTR: ['target'] })
      : null;

    const md = window.markdownit({
      html: Boolean(sanitize),
      linkify: true,
      typographer: true,
      highlight: function(str, lang) {
        if (lang === 'mermaid') {
          // Replaced by the rendered diagram after sanitizing
          return '<pre class="mermaid-source"><code>' + md.utils.escapeHtml(str) + '</code></pre>';
        }
        if (lang && window.hljs && hljs.getLanguage(lang)) {
          try {
            return '<pre class="hljs"><code>' +
              hljs.highlight(str, { language: lang, ignoreIllegals: true }).value +
              '</code></pre>';
          } catch (_) {}
        }
        return '<pre class="hljs"><code>' + md.utils.escapeHtml(str) + '</code></pre>';
      }
    });

    if (window.markdownitFootnote) {
      md.use(markdownitFootnote);
    }

    // Heading ids in GitHub's style ("My Title" → #my-title), so that
    // in-document links such as [Install](#install) have a target.
    md.core.ruler.push('heading_ids', (state) => {
      const seen = new Map();
      state.tokens.forEach((token, i) => {
        if (token.type !== 'heading_open') return;
        const text = state.tokens[i + 1].children
          .filter((t) => t.type === 'text' || t.type === 'code_inline')
          .map((t) => t.content).join('');
        let slug = text.trim().toLowerCase()
          .replace(/[^\p{L}\p{N}\s_-]/gu, '').replace(/\s/g, '-');
        if (!slug) return;
        const count = seen.get(slug) || 0;
        seen.set(slug, count + 1);
        token.attrSet('id', count ? `${slug}-${count}` : slug);
      });
    });

    // Task lists: "- [ ] todo" and "- [x] done" become read-only checkboxes.
    md.core.ruler.push('task_lists', (state) => {
      const tokens = state.tokens;
      for (let i = 2; i < tokens.length; i++) {
        const inline = tokens[i];
        if (inline.type !== 'inline' || tokens[i - 1].type !== 'paragraph_open' ||
            tokens[i - 2].type !== 'list_item_open') continue;
        const first = inline.children[0];
        const match = first && first.type === 'text' && /^\[([ xX])\]\s+/.exec(first.content);
        if (!match) continue;
        first.content = first.content.slice(match[0].length);
        const box = new state.Token('html_inline', '', 0);
        box.content = '<input type="checkbox" disabled' + (match[1] === ' ' ? '' : ' checked') + '> ';
        inline.children.unshift(box);
        tokens[i - 2].attrJoin('class', 'task-list-item');
        for (let j = i - 3; j >= 0; j--) {  // the list this item belongs to
          if (tokens[j].level === tokens[i - 2].level - 1 && /_list_open$/.test(tokens[j].type)) {
            if (!/contains-task-list/.test(tokens[j].attrGet('class') || '')) {
              tokens[j].attrJoin('class', 'contains-task-list');
            }
            break;
          }
        }
      }
    });

    // ── State ──────────────────────────────────────────────────────────────
    let _isDark = false;
    let _mermaidCounter = 0;
    let _renderGeneration = 0;
    // The app shows one document at a time and tells us which (docId); we
    // remember where each one was scrolled to, so switching tabs and
    // re-rendering while typing both keep the reader's place.
    let _docId = null;
    const _scrollByDoc = new Map();

    // ── Mermaid ────────────────────────────────────────────────────────────
    // The library is only loaded once a document contains a diagram, and
    // rendered SVGs are cached by source so that typing elsewhere in the
    // document does not redraw (and flicker) every diagram.
    const MERMAID_CACHE_SIZE = 100;
    const _mermaidCache = new Map();
    let _mermaidLoading = null;

    function initMermaid() {
      if (!window.mermaid) return;
      mermaid.initialize({
        startOnLoad: false,
        theme: _isDark ? 'dark' : 'default',
        securityLevel: 'strict',
      });
    }

    function loadMermaid() {
      if (!_mermaidLoading) {
        _mermaidLoading = new Promise((resolve) => {
          const script = document.createElement('script');
          script.src = 'js/mermaid.min.js';
          script.onload = () => { initMermaid(); resolve(true); };
          script.onerror = () => resolve(false);
          document.head.appendChild(script);
        });
      }
      return _mermaidLoading;
    }

    async function renderDiagram(code) {
      const key = (_isDark ? 'dark|' : 'light|') + code;
      const cached = _mermaidCache.get(key);
      if (cached !== undefined) return cached;
      const { svg } = await mermaid.render(`mermaid-${++_mermaidCounter}`, code);
      if (_mermaidCache.size >= MERMAID_CACHE_SIZE) {
        _mermaidCache.delete(_mermaidCache.keys().next().value);  // oldest entry
      }
      _mermaidCache.set(key, svg);
      return svg;
    }

    // ── Theme ──────────────────────────────────────────────────────────────
    function setTheme(isDark) {
      _isDark = isDark;
      document.body.classList.toggle('dark', isDark);
      document.body.classList.toggle('light', !isDark);
      document.getElementById('hljs-theme').href =
        isDark ? 'css-vendor/highlight-dark.min.css' : 'css-vendor/highlight-light.min.css';
      document.getElementById('marker-theme').href =
        isDark ? 'css/preview-dark.css' : 'css/preview-light.css';
      initMermaid();
    }

    // ── Relative URLs ──────────────────────────────────────────────────────
    // Images and links in a document are relative to the document's folder,
    // not to this page.
    function isRelative(url) {
      return url && !url.startsWith('#') && !/^[a-z][a-z0-9+.-]*:/i.test(url) && !url.startsWith('//');
    }

    function resolveRelativeUrls(root, baseUri) {
      if (!baseUri) return;
      for (const img of root.querySelectorAll('img[src]')) {
        const src = img.getAttribute('src');
        if (isRelative(src)) img.src = new URL(src, baseUri).href;
      }
      for (const a of root.querySelectorAll('a[href]')) {
        const href = a.getAttribute('href');
        if (isRelative(href)) a.href = new URL(href, baseUri).href;
      }
    }

    // ── Render ─────────────────────────────────────────────────────────────
    // scrollPercent (0..1), when given, is where the page is left after
    // rendering; otherwise the document (docId) returns to where it was.
    async function render(markdownText, baseUri, scrollPercent, docId) {
      const generation = ++_renderGeneration;
      const emptyState = document.getElementById('empty-state');
      const content = document.getElementById('content');
      if (docId === undefined || docId === null) docId = _docId;
      let scrollTarget = null;
      if (typeof scrollPercent === 'number') scrollTarget = scrollPercent;
      else if (_scrollByDoc.has(docId)) scrollTarget = _scrollByDoc.get(docId);
      else if (docId !== _docId) scrollTarget = 0;

      if (!markdownText || markdownText.trim() === '') {
        _docId = docId;
        emptyState.style.display = 'flex';
        content.style.display = 'none';
        content.replaceChildren();
        return;
      }

      emptyState.style.display = 'none';
      content.style.display = 'block';

      // Render into a detached element so a slow render never touches the
      // DOM after a newer one has started.
      const fragment = document.createElement('div');
      const html = md.render(markdownText);
      fragment.innerHTML = sanitize ? sanitize(html) : html;
      resolveRelativeUrls(fragment, baseUri);

      const diagrams = fragment.querySelectorAll('pre.mermaid-source');
      if (diagrams.length > 0 && await loadMermaid()) {
        if (generation !== _renderGeneration) return;  // superseded while loading
        for (const source of diagrams) {
          const wrapper = document.createElement('div');
          try {
            wrapper.innerHTML = await renderDiagram(source.textContent.trim());
            wrapper.className = 'mermaid';
          } catch (e) {
            wrapper.className = 'mermaid-error';
            const pre = document.createElement('pre');
            pre.textContent = `Mermaid error:\n${e.message}`;
            wrapper.appendChild(pre);
          }
          if (generation !== _renderGeneration) return;  // superseded
          source.replaceWith(wrapper);
        }
      }

      if (window.renderMathInElement) {
        renderMathInElement(fragment, {
          delimiters: [
            { left: '$$', right: '$$', display: true },
            { left: '$', right: '$', display: false },
            { left: '\\(', right: '\\)', display: false },
            { left: '\\[', right: '\\]', display: true },
          ],
          throwOnError: false,
        });
      }

      if (generation !== _renderGeneration) return;
      _docId = docId;
      content.replaceChildren(...fragment.childNodes);
      if (scrollTarget !== null) setScrollPercent(scrollTarget);
    }

    // ── Scroll position ────────────────────────────────────────────────────
    function getScrollPercent() {
      const el = document.documentElement;
      if (el.scrollHeight <= el.clientHeight) return 0;
      return el.scrollTop / (el.scrollHeight - el.clientHeight);
    }

    function setScrollPercent(pct) {
      const el = document.documentElement;
      el.scrollTop = pct * (el.scrollHeight - el.clientHeight);
      if (_docId !== null) _scrollByDoc.set(_docId, pct);
    }

    function forgetDocument(docId) {
      _scrollByDoc.delete(docId);
    }

    window.addEventListener('scroll', () => {
      if (_docId !== null) _scrollByDoc.set(_docId, getScrollPercent());
    }, { passive: true });
  </script>
</body>
</html>
